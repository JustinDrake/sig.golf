name: Benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    # 64 GiB host: 48 GiB guest, 40 GiB candidate cgroup, with headroom at each level.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 300
    env:
      SIG_VERIFY_PROFILE: balanced
      SIG_VERIFY_VM_CPUS: '12'
      SIG_VERIFY_VM_MEMORY_GIB: '48'
      SIG_VERIFY_BUILD_JOBS: '4'
      SIG_VERIFY_LEAN_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: .cache/trusted.tar.zst
          key: verifier-ubuntu26-vm-${{ runner.arch }}-${{ hashFiles('SigGolf/**', 'SigGolf.lean', 'lakefile.lean', 'lake-manifest.json', 'lean-toolchain', 'verifier/**', 'scripts/setup.sh', 'scripts/blacksmith.sh', 'scripts/vm-setup.sh') }}-v2
      - name: Start verifier VM
        run: bash scripts/blacksmith.sh start
      - name: Setup
        run: bash scripts/blacksmith.sh setup
      # Save trusted builds before candidate verification, even if the proof fails.
      # Only the default branch publishes caches shared with submission branches.
      - name: Export trusted cache
        if: steps.cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        run: bash scripts/blacksmith.sh cache
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        with:
          path: .cache/trusted.tar.zst
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Benchmark
        run: bash scripts/blacksmith.sh run
      - name: Collect results
        if: always()
        run: bash scripts/blacksmith.sh collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-score
          path: scripts/score.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verifier-logs
          path: |
            .work/*/verify.log
            .work/*/telemetry*.json
            scripts/telemetry*.json
            .work-blacksmith-timing.jsonl
            .work-vm-console.log
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Stop verifier VM
        if: always()
        run: bash scripts/blacksmith.sh stop
